name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [release]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEFTHOOK: '0'
        run: yarn release --ci --npm.skipChecks
